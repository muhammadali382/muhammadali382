<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 760 50'
    style='background-color: #00000000;'
    width='760px' height='50px'>

    <defs>
      <linearGradient id="agenticMotionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#10B981">
          <animate attributeName="stop-color" values="#10B981; #06B6D4; #6366F1; #EC4899; #10B981" dur="6s" repeatCount="indefinite" />
        </stop>
        <stop offset="33%" stop-color="#06B6D4">
          <animate attributeName="stop-color" values="#06B6D4; #6366F1; #EC4899; #10B981; #06B6D4" dur="6s" repeatCount="indefinite" />
        </stop>
        <stop offset="66%" stop-color="#6366F1">
          <animate attributeName="stop-color" values="#6366F1; #EC4899; #10B981; #06B6D4; #6366F1" dur="6s" repeatCount="indefinite" />
        </stop>
        <stop offset="100%" stop-color="#EC4899">
          <animate attributeName="stop-color" values="#EC4899; #10B981; #06B6D4; #6366F1; #EC4899" dur="6s" repeatCount="indefinite" />
        </stop>
      </linearGradient>
    </defs>


    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 600;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                                <path id='path0'>
