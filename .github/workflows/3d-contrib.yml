# 3D Isometric Contribution Skyline
# Uses Node 24-compatible actions only (actions/checkout@v7 + github-profile-3d-contrib@0.9.3).

name: Generate 3D Contribution Chart

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/3d-contrib.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: generate-github-profile-3d-contrib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate 3D Contribution Chart
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/3d-contrib-settings.json

      - name: Commit & Push 3D Chart
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update 3D contribution chart [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
