# Contribution Snake Animation
# Generates github-snake.svg (light) and github-snake-dark.svg (dark) on the `output` branch.
# Uses Node 24-compatible actions only (zero Node 20 deprecation warnings).

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#10B981
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#10B981

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake with colorful palette"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
