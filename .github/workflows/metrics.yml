# 📊 GitHub Profile Metrics (Lowlighter/Metrics)
# Generates rich infographic SVGs: isometric calendar, language breakdown, habits
# Requires: METRICS_TOKEN secret (classic PAT with read:user, repo scopes)
#
# 🔑 Setup:
#   1. Go to GitHub → Settings → Developer Settings → Personal Access Tokens → Classic
#   2. Create token with scopes: read:user, repo, public_repo
#   3. Add it to this repo's Secrets as: METRICS_TOKEN

name: Generate Profile Metrics

on:
  schedule:
    - cron: "0 2 * * *"   # Daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Isometric Contribution Calendar ───────────────────────────────
      - name: 🧊 Isometric Contribution Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.isometric.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Karachi
          config_output: svg
          config_padding: 10%

      # ── 2. Languages Breakdown ────────────────────────────────────────────
      - name: 🗂️ Language Breakdown
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_colors: github
          plugin_languages_details: bytes-size, percentage
          config_output: svg

      # ── 3. Coding Habits ──────────────────────────────────────────────────
      - name: ⏰ Coding Habits
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14
          config_timezone: Asia/Karachi
          config_output: svg

      - name: 💾 Commit & Push Metrics
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics.*.svg || true
          git commit -m "📊 Auto-update metrics [skip ci]" || echo "No changes to commit"
          git push
