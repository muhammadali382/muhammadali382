# GitHub Profile Metrics (Lowlighter Metrics)
# Optional workflow: requires a classic PAT secret named METRICS_TOKEN (scopes: read:user, repo).
# Safely skips without failing if METRICS_TOKEN has not been added yet.

name: Generate Profile Metrics

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check METRICS_TOKEN secret
        id: check_token
        env:
          TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::METRICS_TOKEN secret is not set. Add a classic PAT (read:user, repo) in Settings -> Secrets -> Actions to enable metrics generation."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/checkout@v7

      - name: Isometric Contribution Calendar
        if: steps.check_token.outputs.has_token == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.isometric.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Karachi
          config_output: svg
          config_padding: 10%

      - name: Language Breakdown
        if: steps.check_token.outputs.has_token == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_colors: github
          plugin_languages_details: bytes-size, percentage
          config_output: svg

      - name: Commit & Push Metrics
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.*.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: update metrics [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
